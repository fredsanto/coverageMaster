services:
  coveragemaster:
    build: .
    image: coveragemaster
    volumes:
      - ${DATA_DIR:-./DEMO}:/data          # your .cov / .report.txt / ref files
      - ${REF_DIR:-./REF}:/ref  # REF folder (hg19/hg38 annotations)
    environment:
      - COVERAGEMASTER_REF_DIR=/ref
    # Override the command at runtime, e.g.:
    #   docker compose run coveragemaster \
    #       /data/sample.cov /data/sample.report.txt GENE \
    #       -c /data/control.cov -r /data/ref_file -o /data/out
