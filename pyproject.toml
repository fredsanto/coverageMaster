[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coveragemaster"
version = "1.1.0"
description = "CNV caller from samtools depth data using Wavelet-HMM at nucleotide resolution"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.16",
    "scipy>=1.2",
    "matplotlib>=2.2",
    "sympy>=1.0",
    "PyWavelets>=1.0",
    "pandas>=1.0",
    "more-itertools>=8.0",
]

[project.scripts]
coveragemaster               = "coveragemaster.cli:main"
coveragemaster-build-ref     = "coveragemaster.tools.create_ref:main"
coveragemaster-compute-stats = "coveragemaster.tools.compute_stats:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["coveragemaster*"]

[tool.setuptools.package-data]
# REF files are resolved at runtime via _find_ref_file().
# If you copy the REF/ folder inside coveragemaster/, they will be
# included in the wheel automatically via the glob below.
coveragemaster = ["REF/*"]
